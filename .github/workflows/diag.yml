name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "--- A"; dig +short sparkstationpro.com A
          echo "--- AAAA"; dig +short sparkstationpro.com AAAA
          echo "--- www"; dig +short www.sparkstationpro.com
          echo "--- A @8.8.8.8"; dig +short @8.8.8.8 sparkstationpro.com A
          echo "--- CAA"; dig +short sparkstationpro.com CAA
          echo "--- https"; curl -sIv -m 15 https://sparkstationpro.com/ 2>&1 | grep -iE "^< HTTP|subject:|issuer:|SSL certificate|error" | head
